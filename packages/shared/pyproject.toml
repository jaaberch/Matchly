[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchly-shared"
version = "0.1.0"
description = "Shared domain, storage, OTP and job primitives for Matchly"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "SQLAlchemy>=2.0.30,<3",
    "celery>=5.4,<6",
    "redis>=5.0,<6",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["matchly_shared*"]
