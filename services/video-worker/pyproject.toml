[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchly-video-worker"
version = "0.1.0"
description = "FFmpeg-based video processing worker"
requires-python = ">=3.11"
dependencies = [
    "matchly-shared",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.34,<2",
]

[tool.setuptools.packages.find]
include = ["video_worker*"]
