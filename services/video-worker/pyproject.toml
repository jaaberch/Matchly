[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchly-video-worker"
version = "0.1.0"
description = "FFmpeg-based video processing worker"
requires-python = ">=3.11"
dependencies = [
    "matchly-shared",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.34,<2",
    # Frame differencing for the motion detector. Light, and far cheaper than
    # parsing ffmpeg's scene-detection output.
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
]

[tool.setuptools.packages.find]
include = ["video_worker*"]
